<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>导入歌曲</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#f4f5f7;margin:0;padding:24px;color:#111}main{max-width:560px;margin:40px auto;background:#fff;border-radius:18px;padding:22px;box-shadow:0 4px 20px #0001}h1{font-size:22px;margin:0 0 10px}.tip{font-size:14px;color:#666;line-height:1.6;margin-bottom:16px}input[type=file]{display:block;width:100%;font-size:17px;padding:16px;border:2px dashed #888;border-radius:12px;background:#fff}#s{margin-top:15px;font-size:14px;color:#2563eb}</style></head><body><main><h1>选择歌曲</h1><div class="tip">这个页面没有任何文件格式限制，也没有离线缓存。请选择你手机里的 MP3；成功后会自动回到逐句学歌页面。</div><input id="f" type="file"><div id="s"></div></main><script>function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('song-trainer',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('kv'))r.result.createObjectStore('kv')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function save(v){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,'audio');tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}document.getElementById('f').onchange=async e=>{const x=e.target.files&&e.target.files[0];if(!x)return;document.getElementById('s').textContent='正在保存：'+x.name;try{await save(x);document.getElementById('s').textContent='保存成功，正在进入学歌页面…';setTimeout(()=>location.href='./index.html?v=4',300)}catch(err){document.getElementById('s').textContent='保存失败：'+err}}</script></body></html>
